    :root {
      --bg-dark: #070a13;

      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mono-font { font-family: var(--font-mono); }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-panel-cyan { border-color: rgba(0, 242, 254, 0.3); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; font-family: var(--font-heading);
      font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; transition: all 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #030712; }
    .btn-outline { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-cyan { background: rgba(0, 242, 254, 0.15); color: var(--primary-cyan); border: 1px solid rgba(0, 242, 254, 0.3); }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--emerald-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--amber-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--neon-purple); border: 1px solid rgba(139, 92, 246, 0.3); }

    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background-color: currentColor;
      box-shadow: 0 0 10px currentColor; animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto;
    }
    .tab-button {
      padding: 10px 16px; background: transparent; border: none; color: var(--text-muted);
      font-weight: 600; font-size: 0.9rem; border-bottom: 2px solid transparent; cursor: pointer;
    }
    .tab-button.active { color: var(--primary-cyan); border-bottom-color: var(--primary-cyan); }
  </style>

    // Procedural Decal Texture Generator for Frigorífico Silva / BestBeef
    function createRefrigeratedTrailerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#120e0c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const boardHeight = 64;
      for (let y = 0; y < canvas.height; y += boardHeight) {
        const shade = Math.floor(16 + (Math.sin(y) * 0.5 + 0.5) * 12);
        ctx.fillStyle = `rgb(${shade + 6}, ${shade + 2}, ${shade})`;
        ctx.fillRect(0, y, canvas.width, boardHeight - 2);

        ctx.fillStyle = '#060504';
        ctx.fillRect(0, y + boardHeight - 2, canvas.width, 2);
      }

      const grad = ctx.createRadialGradient(400, 480, 80, 400, 480, 520);
      grad.addColorStop(0, 'rgba(18, 14, 12, 0.1)');
      grad.addColorStop(1, 'rgba(8, 6, 5, 0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 880, canvas.height);

      // Bull Head Artwork
      ctx.save();
      const bullX = 400;
      const bullY = 460;

      ctx.fillStyle = '#1a1310';
      ctx.beginPath();
      ctx.ellipse(bullX, bullY - 20, 160, 210, -0.1, 0, Math.PI * 2);
      ctx.fill();

      const headGrad = ctx.createRadialGradient(bullX - 20, bullY - 50, 20, bullX, bullY, 170);
      headGrad.addColorStop(0, '#8c5332');
      headGrad.addColorStop(0.4, '#4a2c1b');
      headGrad.addColorStop(1, '#140e0b');
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.ellipse(bullX - 10, bullY - 40, 145, 185, -0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2c1f18';
      ctx.beginPath();
      ctx.ellipse(bullX - 15, bullY + 110, 85, 65, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0c0806';
      ctx.beginPath();
      ctx.ellipse(bullX - 45, bullY + 115, 18, 12, -0.2, 0, Math.PI * 2);
      ctx.ellipse(bullX + 15, bullY + 115, 18, 12, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d1c7b7';
      ctx.beginPath();
      ctx.moveTo(bullX - 110, bullY - 140);
      ctx.quadraticCurveTo(bullX - 220, bullY - 220, bullX - 170, bullY - 260);
      ctx.quadraticCurveTo(bullX - 140, bullY - 200, bullX - 90, bullY - 150);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(bullX + 90, bullY - 140);
      ctx.quadraticCurveTo(bullX + 200, bullY - 220, bullX + 160, bullY - 260);
      ctx.quadraticCurveTo(bullX + 130, bullY - 200, bullX + 70, bullY - 150);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#080605';
      ctx.beginPath();
      ctx.ellipse(bullX - 85, bullY - 45, 16, 12, -0.2, 0, Math.PI * 2);
      ctx.ellipse(bullX + 65, bullY - 45, 16, 12, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(bullX - 88, bullY - 48, 4, 0, Math.PI * 2);
      ctx.arc(bullX + 62, bullY - 48, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Green Badge
      ctx.save();
      const badgeX = 360;
      const badgeY = 820;
      ctx.fillStyle = '#15803d';
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, 105, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, 98, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#166534';
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, 90, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#86efac';
      ctx.beginPath();
      ctx.moveTo(badgeX - 10, badgeY + 35);
      ctx.bezierCurveTo(badgeX - 55, badgeY - 20, badgeX - 10, badgeY - 55, badgeX + 25, badgeY - 45);
      ctx.bezierCurveTo(badgeX + 45, badgeY, badgeX + 15, badgeY + 35, badgeX - 10, badgeY + 35);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('COMPROMISSO', badgeX, badgeY + 52);
      ctx.font = 'bold 13px Arial, sans-serif';
      ctx.fillText('SUSTENTÁVEL', badgeX, badgeY + 70);
      ctx.restore();

      // Frigorífico Silva Text & Banner
      const silvaX = 960;
      const silvaY = 480;
      ctx.save();
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(silvaX, silvaY - 80);
      ctx.lineTo(silvaX + 80, silvaY - 95);
      ctx.lineTo(silvaX + 70, silvaY + 30);
      ctx.lineTo(silvaX - 10, silvaY + 45);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.moveTo(silvaX + 40, silvaY - 88);
      ctx.lineTo(silvaX + 110, silvaY - 100);
      ctx.lineTo(silvaX + 100, silvaY + 20);
      ctx.lineTo(silvaX + 30, silvaY + 35);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.moveTo(silvaX + 80, silvaY - 95);
      ctx.lineTo(silvaX + 140, silvaY - 105);
      ctx.lineTo(silvaX + 130, silvaY + 10);
      ctx.lineTo(silvaX + 70, silvaY + 25);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 84px Georgia, serif';
      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 12;
      ctx.fillText('Frigorífico Silva', silvaX + 160, silvaY - 10);

      ctx.font = 'italic 36px Georgia, serif';
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('Desde 1972', silvaX + 440, silvaY + 35);
      ctx.restore();

      // Yellow BestBeef Badge
      const beefX = 1440;
      const beefY = 620;
      ctx.save();
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.roundRect(beefX, beefY - 120, 520, 180, 24);
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#111827';
      ctx.font = '900 115px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BestBeef', beefX + 260, beefY + 15);
      ctx.restore();

      // Red CRYOVAC Badge
      ctx.save();
      const cryoX = 1860;
      const cryoY = 870;
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(cryoX, cryoY, 160, 52);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CRYOVAC', cryoX + 80, cryoY + 35);
      ctx.restore();

      // Reflective Safety Tape
      const tapeY = canvas.height - 35;
      const stripeWidth = 60;
      for (let x = 0; x < canvas.width; x += stripeWidth * 2) {
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(x, tapeY, stripeWidth, 25);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x + stripeWidth, tapeY, stripeWidth, 25);
      }

      return new THREE.CanvasTexture(canvas);
    }

    function createCabDoorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.roundRect(90, 200, 332, 115, 18);
      ctx.fill();

      ctx.fillStyle = '#111827';
      ctx.font = '900 68px "Arial Black", Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BestBeef', 256, 282);

      return new THREE.CanvasTexture(canvas);
    }

    // 3D Vehicle Renderer Component
    function Transport3DViewer({ activeCompany }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth;
        const h = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.025);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(16, 7, 19);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const light1 = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0x00f2fe, 1.5);
        light2.position.set(20, 30, 20);
        light2.castShadow = true;
        scene.add(light2);

        const fillLight = new THREE.DirectionalLight(0x8b5cf6, 0.8);
        fillLight.position.set(-20, -10, -20);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(40, 40, 0x00f2fe, 0x1e293b);
        grid.position.y = -0.01;
        scene.add(grid);

        const groundGeo = new THREE.PlaneGeometry(60, 60);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x070a13, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const group = new THREE.Group();
        scene.add(group);

        if (activeCompany.transportType === 'truck') {
          const trailerSideTexture = createRefrigeratedTrailerTexture();
          const doorTexture = createCabDoorTexture();

          // Cab Group
          const cabGroup = new THREE.Group();
          cabGroup.position.set(-4.2, 0, 0);

          const cabinGeo = new THREE.BoxGeometry(2.5, 2.7, 2.3);
          const whitePaintMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.15, metalness: 0.2 });
          const cabinMesh = new THREE.Mesh(cabinGeo, whitePaintMat);
          cabinMesh.position.set(0, 2.2, 0);
          cabinMesh.castShadow = true;
          cabGroup.add(cabinMesh);

          // Roof Deflector Spoiler
          const spoilerShape = new THREE.Shape();
          spoilerShape.moveTo(-1.25, 0);
          spoilerShape.lineTo(1.25, 0);
          spoilerShape.lineTo(0.9, 0.6);
          spoilerShape.lineTo(-1.1, 0.6);
          spoilerShape.closePath();
          const spoilerGeo = new THREE.ExtrudeGeometry(spoilerShape, { depth: 2.25, bevelEnabled: true, bevelSize: 0.05 });
          const spoilerMesh = new THREE.Mesh(spoilerGeo, whitePaintMat);
          spoilerMesh.rotation.y = Math.PI / 2;
          spoilerMesh.position.set(-1.12, 3.55, -1.12);
          cabGroup.add(spoilerMesh);

          // Windshield
          const glassGeo = new THREE.BoxGeometry(0.08, 1.1, 2.1);
          const glassMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.85 });
          const glass = new THREE.Mesh(glassGeo, glassMat);
          glass.position.set(-1.26, 2.65, 0);
          cabGroup.add(glass);

          // Door decals
          const doorDecalMat = new THREE.MeshStandardMaterial({ map: doorTexture, roughness: 0.3 });
          const leftDoor = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), doorDecalMat);
          leftDoor.rotation.y = Math.PI / 2;
          leftDoor.position.set(0.1, 2.1, 1.16);
          cabGroup.add(leftDoor);

          const rightDoor = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), doorDecalMat);
          rightDoor.rotation.y = -Math.PI / 2;
          rightDoor.position.set(0.1, 2.1, -1.16);
          cabGroup.add(rightDoor);

          // Grille
          const grilleMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.4 });
          const grille = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 2.2), grilleMat);
          grille.position.set(-1.26, 1.35, 0);
          cabGroup.add(grille);

          // Headlights
          const headlightMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xfef08a, emissiveIntensity: 0.5 });
          [-0.85, 0.85].forEach(zPos => {
            const hl = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.25, 0.35), headlightMat);
            hl.position.set(-1.26, 1.05, zPos);
            cabGroup.add(hl);
          });

          // Mirrors
          [-1.22, 1.22].forEach(zPos => {
            const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 0.15), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 }));
            mirror.position.set(-0.8, 2.6, zPos);
            cabGroup.add(mirror);
          });

          // Chrome Fuel Tanks
          const tankGeo = new THREE.CylinderGeometry(0.42, 0.42, 1.8, 24);
          const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95, roughness: 0.1 });
          [-1.18, 1.18].forEach(zPos => {
            const tank = new THREE.Mesh(tankGeo, chromeMat);
            tank.rotation.z = Math.PI / 2;
            tank.position.set(0.6, 0.55, zPos);
            cabGroup.add(tank);
          });

          group.add(cabGroup);

          // Trailer Group
          const trailerGroup = new THREE.Group();
          trailerGroup.position.set(2.8, 0, 0);

          const sideMat = new THREE.MeshStandardMaterial({ map: trailerSideTexture, roughness: 0.35, metalness: 0.15 });
          const roofMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.3, roughness: 0.3 });
          const frontMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 });
          const rearMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.7, roughness: 0.2 });

          const boxMaterials = [sideMat, sideMat, roofMat, frontMat, frontMat, rearMat];
          const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(11.5, 3.6, 2.6), boxMaterials);
          boxMesh.position.set(0, 2.65, 0);
          boxMesh.castShadow = true;
          boxMesh.receiveShadow = true;
          trailerGroup.add(boxMesh);

          // Frame Rails
          const frameMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.9, roughness: 0.15 });
          const eTopL = new THREE.Mesh(new THREE.BoxGeometry(11.55, 0.12, 0.12), frameMat);
          eTopL.position.set(0, 4.46, 1.31);
          trailerGroup.add(eTopL);
          const eTopR = new THREE.Mesh(new THREE.BoxGeometry(11.55, 0.12, 0.12), frameMat);
          eTopR.position.set(0, 4.46, -1.31);
          trailerGroup.add(eTopR);

          // Thermo King Unit
          const acBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.6, 2.1), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.3 }));
          acBody.position.set(-5.8, 3.1, 0);
          trailerGroup.add(acBody);

          const ledDisplay = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.25, 0.5), new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe, emissiveIntensity: 0.8 }));
          ledDisplay.position.set(-5.78, 2.7, 0);
          trailerGroup.add(ledDisplay);

          group.add(trailerGroup);

          // Wheel Assemblies
          const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 32);
          const tireMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.85 });
          const rimMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.9, roughness: 0.1 });

          const wheelPositions = [
            [-5.3, 0.55, 1.15], [-5.3, 0.55, -1.15],
            [-3.3, 0.55, 1.15], [-3.3, 0.55, -1.15],
            [-2.1, 0.55, 1.15], [-2.1, 0.55, -1.15],
            [4.2, 0.55, 1.25], [4.2, 0.55, -1.25],
            [5.6, 0.55, 1.25], [5.6, 0.55, -1.25],
            [7.0, 0.55, 1.25], [7.0, 0.55, -1.25]
          ];

          wheelPositions.forEach(([x, y, z]) => {
            const tire = new THREE.Mesh(wheelGeo, tireMat);
            tire.rotation.x = Math.PI / 2;
            tire.position.set(x, y, z);
            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.47, 16), rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.set(x, y, z);
            group.add(tire);
            group.add(rim);
          });

        } else if (activeCompany.transportType === 'ship') {
          const hull = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 3), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
          hull.position.set(0, 0.9, 0);
          group.add(hull);
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 2.4), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          bridge.position.set(-3.5, 3.2, 0);
          group.add(bridge);
        } else {
          const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          fuselage.rotation.z = Math.PI / 2;
          fuselage.position.set(0, 2, 0);
          group.add(fuselage);
        }

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y += 0.005;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, [activeCompany]);

      return (
        <div className="glass-panel" style={{ height: '400px', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(15,23,42,0.8)', padding: '8px 14px', borderRadius: 10 }}>
            <strong>🚚 {activeCompany.transportName}</strong>
            <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Especificação: {activeCompany.modelSpec}</div>
          </div>
          <div ref={mountRef} style={{ width: '100%', height: '100%' }} />
        </div>
      );
    }

    // 3D Virtual Container Interior Plan Component
    function ContainerPlan3D({ activeCompany }) {
      const mountRef = useRef(null);
      const [selectedItem, setSelectedItem] = useState(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth;
        const h = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070b15);

        const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 1000);
        camera.position.set(8, 6, 9);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        // Cutaway Outer Bounding Container Box
        const wire = new THREE.Mesh(
          new THREE.BoxGeometry(9, 2.8, 3.8),
          new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, opacity: 0.3, transparent: true })
        );
        wire.position.y = 1.4;
        scene.add(wire);

        const group = new THREE.Group();
        scene.add(group);

        // Pallets & Cargo Stacks
        const zones = activeCompany.containerLayout.zones;
        const xPos = [-2.8, 0, 2.8];

        zones.forEach((z, idx) => {
          const pal = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: z.status === 'Ideal' || z.status === 'Excelente' ? 0x00f2fe : 0xf59e0b }));
          pal.position.set(xPos[idx], 0.8, 0);
          pal.userData = z;
          group.add(pal);
        });

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y = Math.sin(Date.now() * 0.001) * 0.15;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, [activeCompany]);

      return (
        <div className="glass-panel" style={{ height: '400px', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(15,23,42,0.8)', padding: '8px 14px', borderRadius: 10, zIndex: 5 }}>
            <strong>📦 Planta Virtual 3D do Contêiner</strong>
            <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Distribuição de Cargas & Sensores de Temperatura IoT</div>
          </div>

          <div ref={mountRef} style={{ width: '100%', height: '100%' }} />

          <div style={{ position: 'absolute', bottom: 16, left: 16, display: 'flex', gap: '10px' }}>
            {activeCompany.containerLayout.zones.map((zone, i) => (
              <div key={i} style={{ background: 'rgba(15,23,42,0.85)', padding: '8px 12px', borderRadius: 8, fontSize: '0.75rem', border: '1px solid rgba(255,255,255,0.1)' }}>
                <div style={{ fontWeight: 700, color: '#00f2fe' }}>{zone.name}</div>
                <div style={{ color: '#f8fafc' }}>{zone.item}</div>
                <div style={{ color: zone.temp > activeCompany.targetTempMax ? '#ef4444' : '#10b981', fontWeight: 700 }}>
                  Temp IoT: {zone.temp}°C
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Main App Root
    function App() {
      const [companies, setCompanies] = useState(COMPANIES_DATA);
      const [activeCompany, setActiveCompany] = useState(COMPANIES_DATA[0]);
      const [active3DTab, setActive3DTab] = useState('vehicle');
      const [currentTemp, setCurrentTemp] = useState(COMPANIES_DATA[0].currentTemp);
      const [showReport, setShowReport] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [comment, setComment] = useState('');
      const [feedbacks, setFeedbacks] = useState([
        { user: 'Dr. Roberto Mendes', text: 'Excelente manutenção de temperatura durante o frete!', impact: 'Score de Risco mantido em 12%' }
      ]);

      useEffect(() => {
        setCurrentTemp(activeCompany.currentTemp);
      }, [activeCompany]);

      // Telemetry simulation loop
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTemp(t => parseFloat((t + (Math.random() - 0.49) * 0.15).toFixed(1)));
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      const handleAddFeedback = (e) => {
        e.preventDefault();
        if (!comment.trim()) return;

        const newFb = {
          user: 'Cliente Autenticado',
          text: comment,
          impact: 'IA Re-treinada: Novo plano de contingência adicionado!'
        };

        // Recalculate risk score
        const newScore = Math.max(5, parseInt(activeCompany.aiForecast.riskScore) - 3);
        const updatedComp = {
          ...activeCompany,
          aiForecast: {
            ...activeCompany.aiForecast,
            riskScore: `${newScore}%`,
            preventivePlans: [
              'RECOMENDAÇÃO APÓS FEEDBACK: Vistoria preventiva das borrachas de vedação.',
              ...activeCompany.aiForecast.preventivePlans
            ]
          }
        };

        setActiveCompany(updatedComp);
        setFeedbacks([newFb, ...feedbacks]);
        setComment('');
        setShowFeedbackModal(false);
      };

      return (
        <div style={{ minHeight: '100vh', padding: '20px', maxWidth: '1300px', margin: '0 auto' }}>
          
          {/* Header */}
          <header className="glass-panel" style={{ padding: '16px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{ width: 40, height: 40, background: 'linear-gradient(135deg, #00f2fe, #4facfe)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#000', fontWeight: 800 }}>
                3D
              </div>
              <div>
                <h1 style={{ fontSize: '1.3rem', margin: 0 }}>TransLog <span style={{ color: '#00f2fe' }}>3D</span></h1>
                <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Plataforma de Cargas, Telemetria IoT & IA</div>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '10px' }}>
              <button className="btn btn-outline" onClick={() => setCurrentTemp(t => parseFloat((t + 4.0).toFixed(1)))}>
                🔥 Simular Alerta (+4°C)
              </button>
              <button className="btn btn-primary" onClick={() => setShowReport(true)}>
                📄 Relatório de Entrega
              </button>
            </div>
          </header>

          {/* Company Selector */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px', marginBottom: '24px' }}>
            {companies.map((c) => (
              <div
                key={c.id}
                onClick={() => setActiveCompany(c)}
                className={`glass-panel ${c.id === activeCompany.id ? 'glass-panel-cyan' : ''}`}
                style={{ padding: '16px', cursor: 'pointer', borderColor: c.id === activeCompany.id ? c.color : undefined }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <strong>{c.logo} {c.name}</strong>
                  <span style={{ color: '#f59e0b', fontSize: '0.8rem' }}>★ {c.rating}</span>
                </div>
                <div style={{ fontSize: '0.8rem', color: '#cbd5e1', marginTop: '8px' }}>{c.transportName}</div>
                <div style={{ fontSize: '0.75rem', color: c.color, marginTop: '4px' }}>Carga: {c.cargoName}</div>
              </div>
            ))}
          </div>

          {/* 3D Tab Switcher */}
          <div style={{ marginBottom: '24px' }}>
            <div style={{ display: 'flex', gap: '10px', marginBottom: '12px' }}>
              <button className={`tab-button ${active3DTab === 'vehicle' ? 'active' : ''}`} onClick={() => setActive3DTab('vehicle')}>
                🚛 Modelo 3D da Frota Externa
              </button>
              <button className={`tab-button ${active3DTab === 'container' ? 'active' : ''}`} onClick={() => setActive3DTab('container')}>
                📦 Planta Virtual 3D Interna do Contêiner
              </button>
            </div>

            {active3DTab === 'vehicle' ? (
              <Transport3DViewer activeCompany={activeCompany} />
            ) : (
              <ContainerPlan3D activeCompany={activeCompany} />
            )}
          </div>

          {/* Telemetry Dashboard */}
          <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '20px', marginBottom: '24px' }}>
            <div className="glass-panel" style={{ padding: '20px' }}>
              <h3>🌡️ Monitor de Temperatura IoT</h3>
              <div style={{ display: 'flex', alignItems: 'center', gap: '20px', margin: '16px 0' }}>
                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '16px', borderRadius: 12, border: '1px solid #00f2fe' }}>
                  <div className="mono-font" style={{ fontSize: '2.5rem', fontWeight: 800, color: currentTemp > activeCompany.targetTempMax ? '#ef4444' : '#00f2fe' }}>
                    {currentTemp.toFixed(1)}°C
                  </div>
                  <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Temperatura ao Vivo</div>
                </div>
                <div>
                  <div>Faixa Ideal: <strong>{activeCompany.targetTempMin}°C a {activeCompany.targetTempMax}°C</strong></div>
                  <div style={{ fontSize: '0.8rem', color: '#94a3b8', marginTop: '6px' }}>Status: {currentTemp > activeCompany.targetTempMax ? '⚠️ DESVIO TÉRMICO' : '✓ Estável'}</div>
                </div>
              </div>
            </div>

            <div className="glass-panel" style={{ padding: '20px' }}>
              <h3>📍 Rastreio & ETA GPS</h3>
              <div style={{ margin: '12px 0', fontSize: '0.88rem' }}>
                <div><strong>Origem:</strong> {activeCompany.origin}</div>
                <div><strong>Destino:</strong> {activeCompany.destination}</div>
                <div style={{ marginTop: '8px' }}>Progresso: <strong>{activeCompany.progress}%</strong></div>
                <div style={{ marginTop: '4px' }}>Previsão (ETA): <strong>{activeCompany.eta}</strong></div>
              </div>
            </div>
          </div>

          {/* AI Forecast & Feedback Panel */}
          <div className="glass-panel" style={{ padding: '20px', marginBottom: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h2>🤖 Motor de IA Preditiva & Planos Preventivos</h2>
              <button className="btn btn-primary" onClick={() => setShowFeedbackModal(true)}>
                💬 Enviar Feedback (Alimentar IA)
              </button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.5fr', gap: '20px' }}>
              <div style={{ background: 'rgba(15,23,42,0.6)', padding: '16px', borderRadius: 12 }}>
                <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Risco Estimado da Rota:</div>
                <div className="mono-font" style={{ fontSize: '2.5rem', color: '#10b981', fontWeight: 800 }}>
                  {activeCompany.aiForecast.riskScore}
                </div>
                <span className="badge badge-green">{activeCompany.aiForecast.riskLevel}</span>
              </div>

              <div style={{ background: 'rgba(15,23,42,0.6)', padding: '16px', borderRadius: 12 }}>
                <h4 style={{ color: '#00f2fe', marginBottom: '8px' }}>Planos de Ação Preventiva Gerados pela IA:</h4>
                <ul style={{ paddingLeft: '18px', fontSize: '0.85rem', color: '#cbd5e1' }}>
                  {activeCompany.aiForecast.preventivePlans.map((plan, i) => (
                    <li key={i} style={{ marginBottom: '6px' }}>{plan}</li>
                  ))}
                </ul>
              </div>
            </div>
          </div>

          {/* Feedback Modal */}
          {showFeedbackModal && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ padding: 24 }}>
                <h3>💬 Deixar Feedback do Percurso</h3>
                <form onSubmit={handleAddFeedback} style={{ marginTop: 16 }}>
                  <textarea
                    rows={4}
                    value={comment}
                    onChange={e => setComment(e.target.value)}
                    placeholder="Descreva variações térmicas ou estado da carga para alimentar o algoritmo..."
                    style={{ width: '100%', padding: 12, borderRadius: 8, background: '#070a13', color: '#fff', border: '1px solid #334155' }}
                  />
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 16 }}>
                    <button type="button" className="btn btn-outline" onClick={() => setShowFeedbackModal(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Re-treinar IA</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Report Modal */}
          {showReport && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ padding: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h2>📄 Relatório Final de Entrega</h2>
                  <button className="btn btn-primary" onClick={() => window.print()}>🖨️ Imprimir PDF</button>
                </div>
                <div style={{ marginTop: 20, fontSize: '0.9rem' }}>
                  <p><strong>Empresa Contratante:</strong> {activeCompany.name}</p>
                  <p><strong>Veículo:</strong> {activeCompany.transportName}</p>
                  <p><strong>Carga:</strong> {activeCompany.cargoName} (SKU: {activeCompany.cargoSku})</p>
                  <p><strong>Temperatura Auditada:</strong> {currentTemp.toFixed(1)}°C (Status: Conforme)</p>
                  <p><strong>Rastreio GPS:</strong> {activeCompany.origin} ➔ {activeCompany.destination}</p>
                </div>
                <div style={{ marginTop: 20, textAlign: 'right' }}>
                  <button className="btn btn-outline" onClick={() => setShowReport(false)}>Fechar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
