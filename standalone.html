  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style>
    :root {
      --bg-dark: #070a13;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-cyan: #00f2fe;
      --primary-blue: #3b82f6;
      --emerald-green: #10b981;
      --amber-gold: #f59e0b;
      --coral-red: #ef4444;
      --neon-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mono-font { font-family: var(--font-mono); }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .glass-panel-cyan { border-color: rgba(0, 242, 254, 0.3); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; font-family: var(--font-heading);
      font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; transition: all 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #030712; }
    .btn-outline { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-success { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-cyan { background: rgba(0, 242, 254, 0.15); color: var(--primary-cyan); border: 1px solid rgba(0, 242, 254, 0.3); }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: var(--emerald-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: var(--amber-gold); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--neon-purple); border: 1px solid rgba(139, 92, 246, 0.3); }

    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background-color: currentColor;
      box-shadow: 0 0 10px currentColor; animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto;
    }
    .tab-button {
      padding: 10px 16px; background: transparent; border: none; color: var(--text-muted);
      font-weight: 600; font-size: 0.9rem; border-bottom: 2px solid transparent; cursor: pointer;
    }
    .tab-button.active { color: var(--primary-cyan); border-bottom-color: var(--primary-cyan); }
  </style>
</head>

    // 3D Vehicle Renderer Component
    function Transport3DViewer({ activeCompany }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth;
        const h = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);

        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(12, 9, 15);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        container.appendChild(renderer.domElement);

        const light1 = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0x00f2fe, 1.5);
        light2.position.set(10, 20, 10);
        scene.add(light2);

        const grid = new THREE.GridHelper(30, 30, 0x00f2fe, 0x1e293b);
        scene.add(grid);

        const group = new THREE.Group();
        scene.add(group);

        // Render simple 3D representation
        const mainColor = new THREE.Color(activeCompany.color);
        
        if (activeCompany.transportType === 'truck') {
          // Cabin
          const cab = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.4, 2.0), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
          cab.position.set(-3.2, 1.2, 0);
          group.add(cab);
          // Refrigerator Trailer
          const box = new THREE.Mesh(new THREE.BoxGeometry(6.8, 3.0, 2.4), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          box.position.set(1.4, 1.6, 0);
          group.add(box);
          // ThermoKing AC Unit
          const ac = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 1.8), new THREE.MeshStandardMaterial({ color: mainColor }));
          ac.position.set(-2.2, 2.1, 0);
          group.add(ac);
        } else if (activeCompany.transportType === 'ship') {
          const hull = new THREE.Mesh(new THREE.BoxGeometry(10, 1.8, 3), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
          hull.position.set(0, 0.9, 0);
          group.add(hull);
          const bridge = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 2.4), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          bridge.position.set(-3.5, 3.2, 0);
          group.add(bridge);
        } else {
          const fuselage = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10, 16), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
          fuselage.rotation.z = Math.PI / 2;
          fuselage.position.set(0, 2, 0);
          group.add(fuselage);
        }

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y += 0.006;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, [activeCompany]);

      return (
        <div className="glass-panel" style={{ height: '400px', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(15,23,42,0.8)', padding: '8px 14px', borderRadius: 10 }}>
            <strong>🚚 {activeCompany.transportName}</strong>
            <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Especificação: {activeCompany.modelSpec}</div>
          </div>
          <div ref={mountRef} style={{ width: '100%', height: '100%' }} />
        </div>
      );
    }

    // 3D Virtual Container Interior Plan Component
    function ContainerPlan3D({ activeCompany }) {
      const mountRef = useRef(null);
      const [selectedItem, setSelectedItem] = useState(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth;
        const h = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070b15);

        const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 1000);
        camera.position.set(8, 6, 9);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        // Cutaway Outer Bounding Container Box
        const wire = new THREE.Mesh(
          new THREE.BoxGeometry(9, 2.8, 3.8),
          new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, opacity: 0.3, transparent: true })
        );
        wire.position.y = 1.4;
        scene.add(wire);

        const group = new THREE.Group();
        scene.add(group);

        // Pallets & Cargo Stacks
        const zones = activeCompany.containerLayout.zones;
        const xPos = [-2.8, 0, 2.8];

        zones.forEach((z, idx) => {
          const pal = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: z.status === 'Ideal' || z.status === 'Excelente' ? 0x00f2fe : 0xf59e0b }));
          pal.position.set(xPos[idx], 0.8, 0);
          pal.userData = z;
          group.add(pal);
        });

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          group.rotation.y = Math.sin(Date.now() * 0.001) * 0.15;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
        };
      }, [activeCompany]);

      return (
        <div className="glass-panel" style={{ height: '400px', position: 'relative' }}>
          <div style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(15,23,42,0.8)', padding: '8px 14px', borderRadius: 10, zIndex: 5 }}>
            <strong>📦 Planta Virtual 3D do Contêiner</strong>
            <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Distribuição de Cargas & Sensores de Temperatura IoT</div>
          </div>

          <div ref={mountRef} style={{ width: '100%', height: '100%' }} />

          <div style={{ position: 'absolute', bottom: 16, left: 16, display: 'flex', gap: '10px' }}>
            {activeCompany.containerLayout.zones.map((zone, i) => (
              <div key={i} style={{ background: 'rgba(15,23,42,0.85)', padding: '8px 12px', borderRadius: 8, fontSize: '0.75rem', border: '1px solid rgba(255,255,255,0.1)' }}>
                <div style={{ fontWeight: 700, color: '#00f2fe' }}>{zone.name}</div>
                <div style={{ color: '#f8fafc' }}>{zone.item}</div>
                <div style={{ color: zone.temp > activeCompany.targetTempMax ? '#ef4444' : '#10b981', fontWeight: 700 }}>
                  Temp IoT: {zone.temp}°C
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Main App Root
    function App() {
      const [companies, setCompanies] = useState(COMPANIES_DATA);
      const [activeCompany, setActiveCompany] = useState(COMPANIES_DATA[0]);
      const [active3DTab, setActive3DTab] = useState('vehicle');
      const [currentTemp, setCurrentTemp] = useState(COMPANIES_DATA[0].currentTemp);
      const [showReport, setShowReport] = useState(false);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [comment, setComment] = useState('');
      const [feedbacks, setFeedbacks] = useState([
        { user: 'Dr. Roberto Mendes', text: 'Excelente manutenção de temperatura durante o frete!', impact: 'Score de Risco mantido em 12%' }
      ]);

      useEffect(() => {
        setCurrentTemp(activeCompany.currentTemp);
      }, [activeCompany]);

      // Telemetry simulation loop
      useEffect(() => {
        const timer = setInterval(() => {
          setCurrentTemp(t => parseFloat((t + (Math.random() - 0.49) * 0.15).toFixed(1)));
        }, 3000);
        return () => clearInterval(timer);
      }, []);

      const handleAddFeedback = (e) => {
        e.preventDefault();
        if (!comment.trim()) return;

        const newFb = {
          user: 'Cliente Autenticado',
          text: comment,
          impact: 'IA Re-treinada: Novo plano de contingência adicionado!'
        };

        // Recalculate risk score
        const newScore = Math.max(5, parseInt(activeCompany.aiForecast.riskScore) - 3);
        const updatedComp = {
          ...activeCompany,
          aiForecast: {
            ...activeCompany.aiForecast,
            riskScore: `${newScore}%`,
            preventivePlans: [
              'RECOMENDAÇÃO APÓS FEEDBACK: Vistoria preventiva das borrachas de vedação.',
              ...activeCompany.aiForecast.preventivePlans
            ]
          }
        };

        setActiveCompany(updatedComp);
        setFeedbacks([newFb, ...feedbacks]);
        setComment('');
        setShowFeedbackModal(false);
      };

      return (
        <div style={{ minHeight: '100vh', padding: '20px', maxWidth: '1300px', margin: '0 auto' }}>
          
          {/* Header */}
          <header className="glass-panel" style={{ padding: '16px 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{ width: 40, height: 40, background: 'linear-gradient(135deg, #00f2fe, #4facfe)', borderRadius: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#000', fontWeight: 800 }}>
                3D
              </div>
              <div>
                <h1 style={{ fontSize: '1.3rem', margin: 0 }}>TransLog <span style={{ color: '#00f2fe' }}>3D</span></h1>
                <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Plataforma de Cargas, Telemetria IoT & IA</div>
              </div>
            </div>

            <div style={{ display: 'flex', gap: '10px' }}>
              <button className="btn btn-outline" onClick={() => setCurrentTemp(t => parseFloat((t + 4.0).toFixed(1)))}>
                🔥 Simular Alerta (+4°C)
              </button>
              <button className="btn btn-primary" onClick={() => setShowReport(true)}>
                📄 Relatório de Entrega
              </button>
            </div>
          </header>

          {/* Company Selector */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px', marginBottom: '24px' }}>
            {companies.map((c) => (
              <div
                key={c.id}
                onClick={() => setActiveCompany(c)}
                className={`glass-panel ${c.id === activeCompany.id ? 'glass-panel-cyan' : ''}`}
                style={{ padding: '16px', cursor: 'pointer', borderColor: c.id === activeCompany.id ? c.color : undefined }}
              >
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <strong>{c.logo} {c.name}</strong>
                  <span style={{ color: '#f59e0b', fontSize: '0.8rem' }}>★ {c.rating}</span>
                </div>
                <div style={{ fontSize: '0.8rem', color: '#cbd5e1', marginTop: '8px' }}>{c.transportName}</div>
                <div style={{ fontSize: '0.75rem', color: c.color, marginTop: '4px' }}>Carga: {c.cargoName}</div>
              </div>
            ))}
          </div>

          {/* 3D Tab Switcher */}
          <div style={{ marginBottom: '24px' }}>
            <div style={{ display: 'flex', gap: '10px', marginBottom: '12px' }}>
              <button className={`tab-button ${active3DTab === 'vehicle' ? 'active' : ''}`} onClick={() => setActive3DTab('vehicle')}>
                🚛 Modelo 3D da Frota Externa
              </button>
              <button className={`tab-button ${active3DTab === 'container' ? 'active' : ''}`} onClick={() => setActive3DTab('container')}>
                📦 Planta Virtual 3D Interna do Contêiner
              </button>
            </div>

            {active3DTab === 'vehicle' ? (
              <Transport3DViewer activeCompany={activeCompany} />
            ) : (
              <ContainerPlan3D activeCompany={activeCompany} />
            )}
          </div>

          {/* Telemetry Dashboard */}
          <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '20px', marginBottom: '24px' }}>
            <div className="glass-panel" style={{ padding: '20px' }}>
              <h3>🌡️ Monitor de Temperatura IoT</h3>
              <div style={{ display: 'flex', alignItems: 'center', gap: '20px', margin: '16px 0' }}>
                <div style={{ background: 'rgba(15,23,42,0.8)', padding: '16px', borderRadius: 12, border: '1px solid #00f2fe' }}>
                  <div className="mono-font" style={{ fontSize: '2.5rem', fontWeight: 800, color: currentTemp > activeCompany.targetTempMax ? '#ef4444' : '#00f2fe' }}>
                    {currentTemp.toFixed(1)}°C
                  </div>
                  <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Temperatura ao Vivo</div>
                </div>
                <div>
                  <div>Faixa Ideal: <strong>{activeCompany.targetTempMin}°C a {activeCompany.targetTempMax}°C</strong></div>
                  <div style={{ fontSize: '0.8rem', color: '#94a3b8', marginTop: '6px' }}>Status: {currentTemp > activeCompany.targetTempMax ? '⚠️ DESVIO TÉRMICO' : '✓ Estável'}</div>
                </div>
              </div>
            </div>

            <div className="glass-panel" style={{ padding: '20px' }}>
              <h3>📍 Rastreio & ETA GPS</h3>
              <div style={{ margin: '12px 0', fontSize: '0.88rem' }}>
                <div><strong>Origem:</strong> {activeCompany.origin}</div>
                <div><strong>Destino:</strong> {activeCompany.destination}</div>
                <div style={{ marginTop: '8px' }}>Progresso: <strong>{activeCompany.progress}%</strong></div>
                <div style={{ marginTop: '4px' }}>Previsão (ETA): <strong>{activeCompany.eta}</strong></div>
              </div>
            </div>
          </div>

          {/* AI Forecast & Feedback Panel */}
          <div className="glass-panel" style={{ padding: '20px', marginBottom: '24px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h2>🤖 Motor de IA Preditiva & Planos Preventivos</h2>
              <button className="btn btn-primary" onClick={() => setShowFeedbackModal(true)}>
                💬 Enviar Feedback (Alimentar IA)
              </button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.5fr', gap: '20px' }}>
              <div style={{ background: 'rgba(15,23,42,0.6)', padding: '16px', borderRadius: 12 }}>
                <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Risco Estimado da Rota:</div>
                <div className="mono-font" style={{ fontSize: '2.5rem', color: '#10b981', fontWeight: 800 }}>
                  {activeCompany.aiForecast.riskScore}
                </div>
                <span className="badge badge-green">{activeCompany.aiForecast.riskLevel}</span>
              </div>

              <div style={{ background: 'rgba(15,23,42,0.6)', padding: '16px', borderRadius: 12 }}>
                <h4 style={{ color: '#00f2fe', marginBottom: '8px' }}>Planos de Ação Preventiva Gerados pela IA:</h4>
                <ul style={{ paddingLeft: '18px', fontSize: '0.85rem', color: '#cbd5e1' }}>
                  {activeCompany.aiForecast.preventivePlans.map((plan, i) => (
                    <li key={i} style={{ marginBottom: '6px' }}>{plan}</li>
                  ))}
                </ul>
              </div>
            </div>
          </div>

          {/* Feedback Modal */}
          {showFeedbackModal && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ padding: 24 }}>
                <h3>💬 Deixar Feedback do Percurso</h3>
                <form onSubmit={handleAddFeedback} style={{ marginTop: 16 }}>
                  <textarea
                    rows={4}
                    value={comment}
                    onChange={e => setComment(e.target.value)}
                    placeholder="Descreva variações térmicas ou estado da carga para alimentar o algoritmo..."
                    style={{ width: '100%', padding: 12, borderRadius: 8, background: '#070a13', color: '#fff', border: '1px solid #334155' }}
                  />
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 16 }}>
                    <button type="button" className="btn btn-outline" onClick={() => setShowFeedbackModal(false)}>Cancelar</button>
                    <button type="submit" className="btn btn-primary">Re-treinar IA</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Report Modal */}
          {showReport && (
            <div className="modal-overlay">
              <div className="modal-content" style={{ padding: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h2>📄 Relatório Final de Entrega</h2>
                  <button className="btn btn-primary" onClick={() => window.print()}>🖨️ Imprimir PDF</button>
                </div>
                <div style={{ marginTop: 20, fontSize: '0.9rem' }}>
                  <p><strong>Empresa Contratante:</strong> {activeCompany.name}</p>
                  <p><strong>Veículo:</strong> {activeCompany.transportName}</p>
                  <p><strong>Carga:</strong> {activeCompany.cargoName} (SKU: {activeCompany.cargoSku})</p>
                  <p><strong>Temperatura Auditada:</strong> {currentTemp.toFixed(1)}°C (Status: Conforme)</p>
                  <p><strong>Rastreio GPS:</strong> {activeCompany.origin} ➔ {activeCompany.destination}</p>
                </div>
                <div style={{ marginTop: 20, textAlign: 'right' }}>
                  <button className="btn btn-outline" onClick={() => setShowReport(false)}>Fechar</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
